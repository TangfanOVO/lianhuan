# 打安卓完整体的 APK：后端（Python，靠 Chaquopy 塞进去）＋ 前端都在包里，数据在应用沙箱。
# ★ 跟 android.yml（那个壳）是两条独立的线。后端一改这个就得重打，所以 core/ optional/ 也触发。
# ★ debug 签名：能装能用，不能上架，覆盖安装可能要先卸载。
name: android-full
on:
  push:
    branches: [main]
    paths: ['android-full/**', 'core/**', 'optional/**', 'seed/**', '.github/workflows/android-full.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }     # Chaquopy 要求构建机 Python 跟包里的同一个 3.12
      - name: 打包
        working-directory: android-full
        run: gradle assembleDebug --no-daemon --console=plain
      - name: 改个带日期的名字
        run: cp android-full/app/build/outputs/apk/debug/app-debug.apk "lianhuan-full-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.apk" && ls -la lianhuan-full-*.apk
      - uses: actions/upload-artifact@v4
        with: { name: lianhuan-full-apk, path: 'lianhuan-full-*.apk', retention-days: 30 }
      - name: 挂到 Releases 的「apk-full」标签下（滚动更新）
        if: github.event_name != 'pull_request'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view apk-full >/dev/null 2>&1 || gh release create apk-full --title "安卓完整体 APK（滚动）" --notes "后端和前端都在包里，数据在应用沙箱。自动打的 debug 签名包。装法见 android-full/README.md。" --latest=false
          gh release upload apk-full lianhuan-full-*.apk --clobber
