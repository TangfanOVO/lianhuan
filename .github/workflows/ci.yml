name: verify
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Python contracts
        run: |
          set -euo pipefail
          for f in tests/test_call.py tests/test_core.py tests/test_distill.py tests/test_duplex.py tests/test_echo.py tests/test_kaomoji.py; do
            python "$f"
          done
      - name: Frontend and release checks
        run: |
          set -euo pipefail
          python tools/checkhtml.py
          diff -q app/index.html core/web/index.html
          npm test
          npm run build
          npm run check:privacy
          python tools/preflight.py
      - name: 隐私闸（仓库本身）
        uses: ./.github/actions/privacy-gate
        with: { markers: '${{ secrets.LIANHUAN_PRIVATE_MARKERS }}' }
      - name: Clean generated copy
        run: |
          set -euo pipefail
          out="$(mktemp -d)/lianhuan"
          python create.py --yes "$out"
          echo "CLEAN_COPY=$out" >> "$GITHUB_ENV"
          cd "$out"
          python -m unittest discover -s tests -v
      - name: 隐私闸（create.py 产出的那一份 —— 真正会发出去的东西）
        uses: ./.github/actions/privacy-gate
        with:
          root: ${{ env.CLEAN_COPY }}
          markers: ${{ secrets.LIANHUAN_PRIVATE_MARKERS }}
