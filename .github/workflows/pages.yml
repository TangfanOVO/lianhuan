# 把两样静态的东西发到 GitHub Pages：
#   /          积木预览站（apps/showcase/dist）
#   /app/      应用的空壳预览（apps/preview/dist —— 没有后端，页面顶上明写着）
#   /local/    浏览器版（apps/local/dist —— 后端在页面里跑，家在这台设备的浏览器里）
# ★ dist 永远不进仓库：这里从源码现构建、直接上传。不走 /docs 目录 —— 那里已经有文档。
# ★ 公开仓库每次 push 到 main 都重建；也可手动触发。
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      # ★ 浏览器版要把 Pyodide 随包带走（自托管，不连 CDN），所以这一步不能省
      - run: npm ci
      - name: 隐私闸
        uses: ./.github/actions/privacy-gate
        with: { markers: '${{ secrets.LIANHUAN_PRIVATE_MARKERS }}' }
      - run: node apps/showcase/scripts/build.mjs
      - run: node apps/preview/scripts/build.mjs
      - run: node apps/local/scripts/build.mjs
      - run: |
          mkdir -p site/app site/local
          cp -R apps/showcase/dist/. site/
          cp -R apps/preview/dist/.  site/app/
          cp -R apps/local/dist/.    site/local/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
