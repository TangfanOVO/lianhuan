# 发布前那道隐私闸。**每一条出产物的流水线都要过这一道**：
# Pages、安卓壳、安卓完整体、Docker、verify —— 出门的东西一律先过闸。
#
# ★ 私人词表不写进仓库（把要藏的东西列个清单贴在门口，本身就是泄露），
#   走 Actions Secret `LIANHUAN_PRIVATE_MARKERS` 传进来（逗号分隔）。
#
# ★ 公开出产物时不接受「只绿一半」：Secret 缺失就直接失败。
name: 隐私闸
description: 对待发布的内容跑公开边界扫描（形状与私人词表都必须检查）
inputs:
  root:
    description: 要扫的目录，不填就是仓库本身
    required: false
    default: ''
  markers:
    description: 私人词表，从调用方的 secrets.LIANHUAN_PRIVATE_MARKERS 传进来
    required: false
    default: ''
  require-markers:
    description: 这一步会不会公开产物；公开时缺词表必须失败
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        LIANHUAN_PRIVATE_MARKERS: ${{ inputs.markers }}
        ROOT: ${{ inputs.root }}
        REQUIRE_MARKERS: ${{ inputs.require-markers }}
      run: |
        set -e
        args=""
        [ -n "$ROOT" ] && args="--root $ROOT"
        if [ -z "$LIANHUAN_PRIVATE_MARKERS" ]; then
          if [ "$REQUIRE_MARKERS" = "true" ]; then
            echo "::error title=隐私闸没有关严::缺 LIANHUAN_PRIVATE_MARKERS；私人名字和域名没有检查，停止出产物。"
            exit 1
          fi
          echo "::warning title=隐私闸只跑通用扫描::这一步不发布；私人词表留给发布流水线强制检查。"
          node "$GITHUB_WORKSPACE/scripts/check-public-boundary.mjs" $args
          exit 0
        fi
        echo "### 隐私闸：完整（形状 ＋ 私人词表）" >> "$GITHUB_STEP_SUMMARY"
        PUBLIC_RELEASE=1 node "$GITHUB_WORKSPACE/scripts/check-public-boundary.mjs" $args
