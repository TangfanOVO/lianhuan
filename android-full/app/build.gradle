// 连环 · 安卓完整体 —— 后端（Python）和前端都在 APK 里，数据在应用自己的沙箱。
// ★ 跟隔壁 android/（那个只是指向电脑的壳）是两个工程，互不影响。
// ★ Python 代码不在这儿复制一份：构建前 syncPython 从仓库根把 core/ optional/ seed/ 同步进来（同步目录不进 git）。
plugins {
    id 'com.android.application' version '9.0.0'
    id 'com.chaquo.python' version '17.0.0'
}

android {
    namespace 'app.lianhuan.full'
    compileSdk 36

    defaultConfig {
        applicationId "app.lianhuan.full"
        minSdk 24
        targetSdk 36
        // ★ 版本号必须每次递增，否则装不上去（安卓拒绝「降级」安装）。
        //   CI 传 LH_VERSION_CODE（用 run_number），本机不传就是 1。
        // ★ 先算进局部变量再赋值，别写成 `versionCode (…).toInteger()` ——
        //   Groovy 会把它读成「先调用 versionCode(字符串)，再对返回值调 toInteger()」，
        //   返回值是 null，构建当场炸在 "Value is null"。（0903 CI 上栽过一次。）
        def vCode = Integer.parseInt(System.getenv("LH_VERSION_CODE") ?: "1")
        def vName = System.getenv("LH_VERSION_NAME") ?: "0.1"
        versionCode = vCode
        versionName = vName
        ndk { abiFilters "arm64-v8a" }          // Python 解释器是原生的；只打现在的手机那一种
    }
    /* ★ 签名是这个包最要紧的一件事。
       完整体的家就在应用沙箱里，**签名一变就只能卸载重装，卸载＝家没了**。
       所以：CI 上有 keystore（Actions Secrets 注进来）就出正式签名包，签名从此固定，能覆盖升级；
       没有 keystore 就只出 debug 包，那种包**只能当一次性试用**，别拿它存东西。 */
    signingConfigs {
        release {
            def ks = System.getenv("LH_KEYSTORE")            // 解出来的 .jks 路径
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("LH_KEYSTORE_PASSWORD")
                keyAlias System.getenv("LH_KEY_ALIAS") ?: "lianhuan"
                keyPassword System.getenv("LH_KEY_PASSWORD") ?: System.getenv("LH_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("LH_KEYSTORE")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"                         // 构建机上的 python3 也得是 3.12（CI 里 setup-python 钉的）
        pip {
            install "-r", "requirements.txt"     // ★ pydantic 钉 1.x：pydantic-core 没有安卓轮子
        }
        // 这些包要以真实文件存在：core 读自己目录下的 web/，optional 的包各自带网页，certifi 要给 httpx 找证书
        extractPackages "core", "optional", "seed", "certifi"
    }
    sourceSets {
        getByName("main") { srcDir "build/python-src" }   // 从仓库同步进来的后端（见下）；android_boot.py 在 src/main/python
    }
}

// 把仓库里的后端同步进来。只认这三个目录，别的（tests、node_modules、备份）一律不带。
def syncPython = tasks.register("syncPython", Sync) {
    from("../..") {
        include "core/**", "optional/**", "seed/**"
        exclude "**/__pycache__/**", "**/*.pyc", "**/*.bak*", "**/node_modules/**", "**/.DS_Store"
    }
    into layout.buildDirectory.dir("python-src")
}
// ★ Gradle 9 会校验「谁用了谁的输出」：Chaquopy 的 merge*PythonSources 读 build/python-src，得明说依赖谁
tasks.matching { it.name ==~ /merge.*PythonSources/ || it.name == "preBuild" }.configureEach { dependsOn syncPython }
