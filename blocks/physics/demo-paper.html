<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸夹桌面 · demo</title>
<link rel="stylesheet" href="../base/tokens.css">
<link rel="stylesheet" href="paper-stack.css">
<style>
  /* ════════════════════════════════════════════════════════════════════
     ★ 0902：这层壳是照原件主页整段搬的（.app / .top 那两行 z-index / .body.nopad）。
       **不是装饰**：画布的缩放是 fit() 量**父容器的宽**算出来的
       （k = min(1, parent.clientWidth/440)），壳摆错了 k 就永远等于 1，
       任何窄屏都不缩，画布被外面那层 overflow 硬裁掉 —— 原来就是这样。
     ════════════════════════════════════════════════════════════════════ */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.7 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif}
  /* = 原件的 .app。底纸墙 inset:0 贴的就是这一层，所以它必须 position:relative。
     680 以上收成一台手机宽：墙自己只有 628 宽（x −65→563），铺在更宽的窗口里右边会秃。 */
  .wrap{position:relative;height:100dvh;display:flex;flex-direction:column;
        overflow:hidden;overflow:clip}
  @media (min-width:680px){
    .wrap{max-width:440px;height:min(894px,92dvh);margin:20px auto;
          border-radius:34px;box-shadow:var(--shadow-lift)}
  }
  /* 原件 .top 上记的坑：底纸墙是 absolute z-index:0，顶栏 static＝不参与层叠，会被它整条盖住 */
  .top{flex:0 0 auto;position:relative;z-index:9;
       padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .top b{font-size:15px} .top i{font-style:normal;font-size:11.5px;color:var(--hint);margin-left:8px}
  /* = 原件的 .body.nopad：左右内边距归零（440 的画布要铺满）、z-index 压在底纸墙上面。
     ★ 原件竖着这一路是 clip（主页钉死一屏，参考机型正好 440×894 装得下）。
       demo 这边竖着放开成 auto：fit() 只按宽度算 k，窗口比 748*k 还矮时最下面那排卡
       会被切掉 —— 与其硬裁不如让它滚（跟丝线那边「短屏不压扁，改成整页滚」同一条）。
     ★ 横着仍旧关死：画布缩完正好等于容器宽，多出来的是底纸，不许拿它撑出横滚条。 */
  .stagewrap{flex:1 1 auto;min-height:0;position:relative;z-index:1;
             overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .knob{flex:0 0 auto;position:relative;z-index:9;
    display:flex;align-items:center;gap:10px;padding:10px 18px;
    border-top:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--sub)}
  .knob input{flex:1}
</style>

<script>
  /* 风力两种排法共用一个键（应用里那根滑杆也是它） */
  var w = document.getElementById('wind'), wv = document.getElementById('wv');
  try { var v = localStorage.getItem('silk.wind'); if (v != null) { w.value = JSON.parse(v); wv.textContent = w.value; } } catch(e){}
  w.addEventListener('input', function(){
    wv.textContent = this.value;
    try { localStorage.setItem('silk.wind', JSON.stringify(+this.value)); } catch(e){}
    location.reload();          /* 几何是初始化时算的，换风力最省事的办法是重来一遍 */
  });
</script>
